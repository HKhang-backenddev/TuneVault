<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#667eea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TuneVault" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Ứng dụng nghe nhạc trực tuyến với AI Assistant" />
    
    <title>TuneVault - Music Streaming</title>
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    
    <style>
      /* Biện pháp mạnh: Ép nền đen ngay từ file HTML */
      html, body { background-color: #1a1a2e !important; margin: 0; padding: 0; }
      #root { background-color: #1a1a2e !important; min-height: 100vh; }
    </style>
  </head>
  <body class="bg-black text-white selection:bg-green-500 selection:text-black">
    <div id="root"></div>
    <noscript>Bạn cần bật JavaScript để chạy ứng dụng này.</noscript>
    <script type="module" src="/main.tsx"></script>
    <script>
      // Kiểm tra xem root có nội dung không sau 3 giây
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.innerHTML === "") {
          console.warn("Cảnh báo: Root đang trống. Nếu màn hình vẫn đen, hãy kiểm tra lỗi đỏ trong tab Console (F12).");
        }
      }, 3000);
      
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // SW registration failed, app still works
          });
        });
      }
    </script>
  </body>
</html>
